dependencies {
    // --- 다른 모듈 ---
    implementation project(path: ':core')
    implementation project(path: ':event')
    testImplementation(testFixtures(project(':core')))

    // --- Spring Boot Starters ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // --- Swagger (OpenAPI) ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
    // springdoc 2.1.0이 번들한 Swagger UI 대신 5.32.14를 쓴다(공식 다크모드 5.31.0+, XSS 패치 5.32.14). 버전은 application.yml의 springdoc.swagger-ui.version과 같이 올릴 것
    implementation 'org.webjars:swagger-ui:5.32.14'

    // --- FCM (Firebase) ---
    implementation 'com.google.firebase:firebase-admin:9.2.0'

    // --- Local Cache (Caffeine) ---
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // --- Dotenv (로컬 .env 파일 자동 로드) ---
    runtimeOnly 'me.paulschwarz:spring-dotenv:4.0.0'

    // --- Kafka For Test ---
    testImplementation 'org.springframework.kafka:spring-kafka'  // 테스트에서 리스너 레지스트리(파티션 할당 대기)를 쓰기 위함
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

// --- 빌드 설정 ---
tasks.named('bootRun') {
    workingDir = rootProject.projectDir  // spring-dotenv가 루트의 .env를 찾도록
}

tasks.named('bootJar') {
    enabled = true
}

tasks.named('jar') {
    enabled = true
}
