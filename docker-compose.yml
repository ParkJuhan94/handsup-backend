# Docker Desktop에서 이 파일의 컨테이너가 "handsup" 그룹 아래 redis·mysql·redpanda로 묶여 보이게 한다.
# 컨테이너 이름이 "<프로젝트 이름>-"으로 시작하면 Docker Desktop이 접두어를 떼고 서비스 이름만 보여준다.
name: handsup

services:
  redis:
    image: redis:latest
    container_name: handsup-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_HOST_PASSWORD}" ]
    deploy:
      resources:
        limits:
          memory: 256M

  mysql:
    image: mysql:8.0
    container_name: handsup-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Apache Kafka(JVM, 실측 약 720MiB)를 Kafka 와이어 프로토콜 호환 브로커인 Redpanda(네이티브)로 교체했다.
  # 코드는 Spring Kafka 클라이언트(KafkaTemplate, @KafkaListener, @RetryableTopic, KafkaAdmin)만 쓰므로
  # 그대로 붙는다. 로컬 전용이며 운영 EC2 브로커(handsup-kafka 저장소)는 Apache Kafka 그대로다.
  # 서비스 이름은 기존 명령(up -d mysql redis redpanda)과 문서를 최소로 바꾸려고 redpanda로 정했다.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: handsup-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --set redpanda.auto_create_topics_enabled=true
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
      # 컨테이너 내부는 handsup-redpanda:9092, 호스트(로컬 bootRun)는 기존과 같은 localhost:29092 -
      # application.yml의 bootstrap-servers 기본값을 바꾸지 않아도 된다.
      - --advertise-kafka-addr internal://handsup-redpanda:9092,external://localhost:29092
      - --rpc-addr handsup-redpanda:33145
      - --advertise-rpc-addr handsup-redpanda:33145
    ports:
      - "29092:29092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped
    # redpanda 자체 --memory(512M)보다 여유를 둔다 - 컨테이너 한도는 non-heap/OS 오버헤드까지 포함해야 한다.
    deploy:
      resources:
        limits:
          memory: 900M
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  redis_data:
  mysql_data:
  redpanda_data:
